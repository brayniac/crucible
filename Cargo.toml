[workspace]
resolver = "2"

members = [
	# Cache Implementations and Core
	"cache/core",
	"cache/segcache",
	"cache/slab",
	"cache/heap",

# Protocol Implementations
	"protocol/momento",
	"protocol/ping",

	# Server
	"server",

	# Proxy
	"proxy",

	# In-Process Cache Benchmark
	"cache-bench",

	# Development Tasks
	"xtask",

	# Metrics
	"metrics",

]

[workspace.package]
authors = ["Brian Martin <brayniac@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brayniac/crucible"

[workspace.dependencies]
# Shared dependencies across workspace
ahash = "0.8"
bytes = "1.11.1"
clap = "4"
clocksource = "1.0"
crossbeam-channel = "0.5"
crossbeam-deque = "0.8"
itoa = "1.0"
libc = "0.2"
loom = "0.7"
memmap2 = "0.9"
metriken = "0.9"
num_cpus = "1.16"
parking_lot = "0.12"
rand = "0.9"
rustls = { version = "0.23", default-features = false }
serde = "1"
shuttle = "0.9"
slab = "0.4"
smallvec = "1.13"
thiserror = "2"
tokio = "1"
toml = "0.8"
tracing = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
ringline = { version = "0.6.1", features = ["timestamps"] }
ringline-redis = "0.7"
http2-proto = "0.0.2"
grpc-proto = "0.0.2"
protocol-momento = { path = "protocol/momento" }
protocol-ping = { path = "protocol/ping" }
resp-proto = "0.0.2"
memcache-proto = "0.0.5"
cache-core = { path = "cache/core" }
segcache = { path = "cache/segcache" }
slab-cache = { path = "cache/slab" }
heap-cache = { path = "cache/heap" }
metrics = { path = "metrics" }
ketama = "0.0.2"


# Jemalloc allocator
tikv-jemallocator = "0.6"
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = true

# The comparison is crucible main against cache-rs upstream. crates.io is at
# 0.4.4; upstream main carries work that is not released yet.
#
# Pinned to an exact rev rather than `branch = "main"`: a branch ref drifts if
# anyone pushes mid-sweep, and a result that cannot name the code it measured
# is not reproducible. Bump this deliberately, and re-run rather than mixing
# arms across revs.
[patch.crates-io]
segcache = { git = "https://github.com/pelikan-io/cache-rs", rev = "2af1aff1020ba94cb3e58a2722e41b1403e390d1" }

