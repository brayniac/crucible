[package]
name = "cache-bench"
version = "0.4.2-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process cache benchmark tool"

[dependencies]
# Cache implementations
cache-core = { workspace = true }
segcache = { workspace = true }
slab-cache = { workspace = true }
heap-cache = { workspace = true }

# Metrics
metrics = { workspace = true }
metriken = { workspace = true }

# Configuration
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# RNG
rand = { workspace = true }
rand_xoshiro = "0.7"

# Utilities
libc = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }
humantime = "2.1"
zstd = "0.13"

# Renamed: crucible already has a crate called `segcache`. Optional so the
# default build does not pay for a second cache engine.
#
# cache-rs upstream. Everything the comparison needs is there now -- the
# virtual clock (#102), a seeded eviction generator (#103), and the fix that
# stopped it serving items past their TTL (#104) -- so the fork this used to
# pin is retired. Comparisons made against the fork credited cache-rs with
# hits on expired items and are not comparable with ones made against this.
#
# Pinned to an exact rev rather than `branch = "main"`: a branch ref drifts if
# anyone pushes mid-sweep, and a result that cannot name the code it measured
# is not reproducible. Bump this deliberately, and re-run rather than mixing
# arms across revs.
cache_rs = { package = "segcache", git = "https://github.com/pelikan-io/cache-rs", rev = "53d2e9a0fae421a67c3522088dc8dfd1ad05d1ba", optional = true }

# Jemalloc
tikv-jemallocator = { workspace = true }

[features]
default = []
cache-rs = ["dep:cache_rs"]
# Drive the cache's expiry clock from the trace's own timestamps. Without
# it the cache expires against the wall clock while the replay consumes
# hours of recorded time in seconds, so no TTL shorter than the run ever
# fires and every policy that consults expiry is measured as though the
# mechanism were absent.
virtual-clock = ["cache-core/virtual-clock", "cache_rs?/virtual-clock"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "crucible-cache-bench"
path = "src/main.rs"
