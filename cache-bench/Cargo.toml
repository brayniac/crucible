[package]
name = "cache-bench"
version = "0.4.2-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process cache benchmark tool"

[dependencies]
# Cache implementations
cache-core = { workspace = true }
segcache = { workspace = true }
slab-cache = { workspace = true }
heap-cache = { workspace = true }

# Metrics
metrics = { workspace = true }
metriken = { workspace = true }

# Configuration
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

# CLI
clap = { workspace = true, features = ["derive"] }

# RNG
rand = { workspace = true }
rand_xoshiro = "0.7"

# Utilities
libc = { workspace = true }
ctrlc = { version = "3", features = ["termination"] }
humantime = "2.1"
zstd = "0.13"

# Renamed: crucible already has a crate called `segcache`. Optional so the
# default build does not pay for a second cache engine.
# The fork, for the virtual clock. Driving only one engine's clock is as
# wrong as driving neither: the engine honouring expiry loses the hits it
# correctly discards while the other keeps serving them, so a comparison
# needs the feature on both sides.
cache_rs = { package = "segcache", git = "https://github.com/brayniac/cache-rs", rev = "27ca521d860afc6af1e5223f8cfbcdefc0b716f9", optional = true }

# Jemalloc
tikv-jemallocator = { workspace = true }

[features]
default = []
cache-rs = ["dep:cache_rs"]
# Drive the cache's expiry clock from the trace's own timestamps. Without
# it the cache expires against the wall clock while the replay consumes
# hours of recorded time in seconds, so no TTL shorter than the run ever
# fires and every policy that consults expiry is measured as though the
# mechanism were absent.
virtual-clock = ["cache-core/virtual-clock", "cache_rs?/virtual-clock"]
# Tally what each engine's merge passes keep, by item size and frequency
# band, and print the retention rate per cell. Five hypotheses about the
# retention *decision* have been falsified by measuring its effects; this
# measures the decision. Both engines must have it, with identical
# bucketing, or the comparison measures two instruments.
retention-trace = ["cache-core/retention-trace", "cache_rs?/retention-trace"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "crucible-cache-bench"
path = "src/main.rs"
