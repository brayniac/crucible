name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --release

  test-loom:
    name: Test (loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cache-core --features loom

  tsan:
    name: Test (tsan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ThreadSanitizer over the lock-free cache crates. TSan models atomics
    # correctly, so the hashtable slot protocol, segment state machine and
    # refcounts produce no reports of their own -- it flags exactly the
    # non-atomic accesses that race, which stress tests only hit by luck.
    # It earned its place immediately: the item flags byte was written by
    # mark_deleted's atomic fetch_or and read by every lookup's header
    # decode as a plain byte, and TSan reported it on the first run.
    #
    # No suppressions: the tree is clean, and a report should fail the job
    # rather than accumulate exceptions. halt_on_error stops at the first.
    #
    # Scope is `--lib` on the four cache crates plus the disk-tier
    # integration test: that is where the shared mutable state lives, it runs
    # in seconds under the sanitizer, and it skips both the integration soaks
    # (large_value_tests, tens of seconds each before TSan's slowdown) and
    # doctests, whose rustdoc invocations do not get the sanitizer ABI flags
    # under -Zbuild-std.
    #
    # The disk-tier test is included deliberately. `DiskSegmentMeta` carries
    # its own `mark_deleted`, and a `--lib`-only scope does not execute it --
    # which is exactly how its non-atomic tombstone write survived the first
    # pass of this job. Concurrency coverage is what this job can see, so a
    # path with no concurrent test is a path TSan is not checking.
    env:
      RUSTFLAGS: "-Zsanitizer=thread"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: |
          cargo +nightly test \
            -p cache-core -p segcache -p slab-cache -p heap-cache \
            -Zbuild-std --target x86_64-unknown-linux-gnu --lib
          cargo +nightly test \
            -p segcache -Zbuild-std --target x86_64-unknown-linux-gnu \
            --test io_uring_disk_tier_tests

  miri:
    name: Test (miri)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Miri over the item-header decode path, under Stacked Borrows.
    #
    # This checks something TSan structurally cannot: the ALIASING claim a
    # reference makes, as opposed to the accesses it performs. The flags byte
    # is written by `mark_deleted` after an item is published, so a `&[u8]`
    # spanning a header is `noalias readonly` at the ABI boundary and
    # `SharedReadOnly` under Stacked Borrows -- neither true of memory a
    # concurrent writer mutates. Reading the flags byte from such a slice
    # retags a `SharedReadWrite` `&AtomicU8` from a read-only parent, which
    # Miri rejects at the retag, single-threaded, with no race required.
    #
    # It earned its place the same way the TSan job did: run against the tree
    # before the decoders took raw pointers, it failed on an existing test.
    #
    # Scope is deliberately narrow. Miri cannot execute the real segment
    # allocator -- `hugepage.rs` allocates with `mmap`, which Miri does not
    # support -- nor anything calling `clocksource`, which issues a syscall.
    # So this runs the header decoders and the segment tests that build their
    # memory with the global allocator and stay off the clock. That is enough
    # to cover the decode path itself, which is where the aliasing claim is
    # made; it is NOT general UB coverage of the cache.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Header decode under Miri
        run: |
          cargo +nightly miri test -p cache-core --lib item::
          cargo +nightly miri test -p cache-core --lib \
            slice_segment::tests::decoding_a_published_header
          cargo +nightly miri test -p cache-core --lib \
            slice_segment::tests::header_ptr_rejects

  smoketest:
    name: Smoketest (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - segment-s3fifo
          - segment-fifo
          - segment-random
          - segment-cte
          - segment-merge
          - heap-s3fifo
          - heap-lfu
          - heap-random
          - slab-lra
          - slab-lrc
          - slab-random
          - segment-s3fifo-directio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug server with validation
        run: cargo build -p server --features server/validation
      - name: Install cachecannon
        run: curl -fsSL https://cachecannon.cc/install.sh | bash
      - name: Run smoketest
        env:
          # Enable debug assertions in dependencies
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail

          CONFIG="server/config/smoketest/${{ matrix.config }}.toml"
          echo "Testing configuration: $CONFIG"
          echo "Using debug build with validation feature (checksums + assertions)"

          # Start server (debug build)
          ./target/debug/crucible-server "$CONFIG" &
          SERVER_PID=$!
          sleep 3  # Debug builds start slower

          # Verify server started
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server failed to start"
            exit 1
          fi

          # Run eviction test benchmark
          cachecannon server/config/smoketest/benchmark-eviction-test.toml || {
            echo "ERROR: Benchmark failed"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

          # Check server is still running (didn't crash)
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server crashed during benchmark"
            exit 1
          fi

          # Clean shutdown
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "PASS: ${{ matrix.config }}"
