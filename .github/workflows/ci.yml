name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --release

  test-loom:
    name: Test (loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cache-core --features loom

  tsan:
    name: Test (tsan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ThreadSanitizer over the lock-free cache crates. TSan models atomics
    # correctly, so the hashtable slot protocol, segment state machine and
    # refcounts produce no reports of their own -- it flags exactly the
    # non-atomic accesses that race, which stress tests only hit by luck.
    # It earned its place immediately: the item flags byte was written by
    # mark_deleted's atomic fetch_or and read by every lookup's header
    # decode as a plain byte, and TSan reported it on the first run.
    #
    # No suppressions: the tree is clean, and a report should fail the job
    # rather than accumulate exceptions. halt_on_error stops at the first.
    #
    # Scope is `--lib` on the four cache crates: that is where the shared
    # mutable state lives, it runs in seconds under the sanitizer, and it
    # skips both the integration soaks (large_value_tests, tens of seconds
    # each before TSan's slowdown) and doctests, whose rustdoc invocations
    # do not get the sanitizer ABI flags under -Zbuild-std.
    env:
      RUSTFLAGS: "-Zsanitizer=thread"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: >
          cargo +nightly test
          -p cache-core -p segcache -p slab-cache -p heap-cache
          -Zbuild-std --target x86_64-unknown-linux-gnu --lib

  smoketest:
    name: Smoketest (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - segment-s3fifo
          - segment-fifo
          - segment-random
          - segment-cte
          - segment-merge
          - heap-s3fifo
          - heap-lfu
          - heap-random
          - slab-lra
          - slab-lrc
          - slab-random
          - segment-s3fifo-directio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug server with validation
        run: cargo build -p server --features server/validation
      - name: Install cachecannon
        run: curl -fsSL https://cachecannon.cc/install.sh | bash
      - name: Run smoketest
        env:
          # Enable debug assertions in dependencies
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail

          CONFIG="server/config/smoketest/${{ matrix.config }}.toml"
          echo "Testing configuration: $CONFIG"
          echo "Using debug build with validation feature (checksums + assertions)"

          # Start server (debug build)
          ./target/debug/crucible-server "$CONFIG" &
          SERVER_PID=$!
          sleep 3  # Debug builds start slower

          # Verify server started
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server failed to start"
            exit 1
          fi

          # Run eviction test benchmark
          cachecannon server/config/smoketest/benchmark-eviction-test.toml || {
            echo "ERROR: Benchmark failed"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

          # Check server is still running (didn't crash)
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server crashed during benchmark"
            exit 1
          fi

          # Clean shutdown
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "PASS: ${{ matrix.config }}"
