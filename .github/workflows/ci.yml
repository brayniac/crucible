name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all

  test-release:
    name: Test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all --release

  test-loom:
    name: Test (loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cache-core --features loom

  # Shuttle is the complement of loom, not a replacement. loom models weak
  # memory and is the only check that no ordering is too weak, but it
  # over-approximates SeqCst -- it reports the store-buffering outcome even for
  # a pure-SeqCst litmus, which is why its models assert only SC-independent
  # properties. Shuttle executes sequentially consistently, which makes the
  # SC-total-order (Dekker) invariants assertable: a pinned reader never
  # coexists with a committed drain, and a condemned segment is freed exactly
  # once -- never stranded in AwaitingRelease, never twice. The trade is
  # symmetric: shuttle can never catch an ordering that is too weak. Keep both
  # green; neither subsumes the other. See crucible#129.
  #
  # The name filter matters: like loom's, these models panic outside their
  # runner.
  test-shuttle:
    name: Test (shuttle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cache-core --features shuttle --release -- shuttle_
      # The `Clippy` job runs `--all-features`, which turns `loom` on and so
      # compiles the shuttle module (gated `not(feature = "loom")`) straight
      # out. Without this line the models are never linted.
      - run: cargo clippy -p cache-core --features shuttle --all-targets -- -D warnings

  # Kani proves the bit-packing substrate the concurrency protocols rest on.
  #
  # These are deliberate LEAF-function proofs: exhaustive symbolic coverage of
  # pure pack/unpack arithmetic over full input domains, where the unit tests
  # were hand-picked cases. Kani explores no thread interleavings -- loom and
  # TSan own that axis.
  #
  # The surface earned this. Reviewing one 150-line layout module turned up four
  # arithmetic defects across three rounds, one Critical; and a live entry that
  # packed to the hashtable's all-zero empty-slot sentinel silently lost 1 key in
  # 4096 for every backend's first item (#115). Kani finds that one in 19ms.
  #
  # Hand-rolled install rather than model-checking/kani-github-action: the action
  # pins an old Kani and compiles kani-verifier from source on every run.
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KANI_VERSION: "0.67.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: ${{ runner.os }}-kani-${{ env.KANI_VERSION }}

      # The guard is FUNCTIONAL, not just presence: `cargo kani setup` installs a
      # pinned nightly under ~/.rustup and symlinks ~/.kani/kani-<ver>/toolchain
      # to it. The cache restores ~/.kani but NOT ~/.rustup, so on a warm run the
      # symlink dangles while `cargo kani --version` still answers -- checking
      # rustc through the symlink is what makes warm runs re-heal.
      - name: Install Kani
        run: |
          if ! command -v cargo-kani >/dev/null \
             || [ "$(cargo kani --version | awk '{print $2}')" != "$KANI_VERSION" ] \
             || ! "$HOME/.kani/kani-$KANI_VERSION/toolchain/bin/rustc" --version >/dev/null 2>&1; then
            # --force: on a warm run the cache has already restored
            # ~/.cargo/bin/cargo-kani, so a plain install aborts with
            # "binary `cargo-kani` already exists in destination" -- the guard
            # would detect the dangling toolchain and then be unable to heal it.
            cargo install --force --version "$KANI_VERSION" --locked kani-verifier
            cargo kani setup
          fi

      - name: Verify cache-core harnesses
        run: cargo kani -p cache-core

      - name: Verify slab harnesses
        run: cargo kani -p slab-cache

  tsan:
    name: Test (tsan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ThreadSanitizer over the lock-free cache crates. TSan models atomics
    # correctly, so the hashtable slot protocol, segment state machine and
    # refcounts produce no reports of their own -- it flags exactly the
    # non-atomic accesses that race, which stress tests only hit by luck.
    # It earned its place immediately: the item flags byte was written by
    # mark_deleted's atomic fetch_or and read by every lookup's header
    # decode as a plain byte, and TSan reported it on the first run.
    #
    # No suppressions: the tree is clean, and a report should fail the job
    # rather than accumulate exceptions. halt_on_error stops at the first.
    #
    # Scope is `--lib` on the four cache crates plus the disk-tier
    # integration test: that is where the shared mutable state lives, it runs
    # in seconds under the sanitizer, and it skips both the integration soaks
    # (large_value_tests, tens of seconds each before TSan's slowdown) and
    # doctests, whose rustdoc invocations do not get the sanitizer ABI flags
    # under -Zbuild-std.
    #
    # The disk-tier test is included deliberately. `DiskSegmentMeta` carries
    # its own `mark_deleted`, and a `--lib`-only scope does not execute it --
    # which is exactly how its non-atomic tombstone write survived the first
    # pass of this job. Concurrency coverage is what this job can see, so a
    # path with no concurrent test is a path TSan is not checking.
    env:
      RUSTFLAGS: "-Zsanitizer=thread"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1"
        run: |
          cargo +nightly test \
            -p cache-core -p segcache -p slab-cache -p heap-cache \
            -Zbuild-std --target x86_64-unknown-linux-gnu --lib
          cargo +nightly test \
            -p segcache -Zbuild-std --target x86_64-unknown-linux-gnu \
            --test io_uring_disk_tier_tests

  miri:
    name: Test (miri)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Miri under Stacked Borrows, over nearly all of cache-core.
    #
    # This checks two things TSan structurally cannot. First, the ALIASING
    # claim a reference makes rather than the accesses it performs: a `&[u8]`
    # spanning an item header is `noalias readonly` and `SharedReadOnly`, and
    # `mark_deleted` writes the flags byte inside it, so merely creating that
    # reference is wrong -- Miri rejects it single-threaded, no race needed.
    # Second, PROVENANCE: a raw pointer that stops being valid before it is
    # used, which no sanitiser sees because the address is still correct.
    #
    # It has found four defects so far, none of which the other jobs caught:
    # the header decoders' `&[u8]`, whole-item slices spanning the flags byte
    # (a genuine data race), a free-queue pointer invalidated by the pool's own
    # use of its `Box`, and `Steal::Retry` read as "queue empty".
    #
    # `-Zmiri-disable-isolation` is required: `clocksource` calls
    # `clock_gettime`, which isolation blocks. Anonymous `mmap` needs nothing --
    # Miri shims it.
    #
    # Excluded, and why:
    #
    #  - the four `disk::` modules that build a pool -- `memmap2` maps a FILE,
    #    which Miri does not support. Anonymous mappings are fine; file-backed
    #    ones are not. `disk::disk_segment_meta` DOES run: it allocates through
    #    the global allocator.
    #  - `cache::tests::test_stale_location_is_rejected_on_the_disk_arms` --
    #    same reason, but it lives outside the `disk::` modules: it builds a
    #    DiskLayer, and therefore a file-backed FilePool, to reach the verifier's
    #    disk arms. Module-level skips do not catch it.
    #  - `hugepage::` -- Miri accepts `mmap` only with MAP_PRIVATE|MAP_ANONYMOUS
    #    and the hugepage path adds MAP_HUGETLB. Excluded rather than worked
    #    around: unlike a prefetch, the mmap flags decide what is actually
    #    allocated, so compiling them out would change what is tested.
    #
    #    The THP `madvise` hint in the same file IS compiled out under
    #    `cfg(miri)` -- it is advisory and its result is already discarded, and
    #    every pool-building test reaches it, so without that nothing here
    #    would run on Linux at all. Both are Linux-only paths, so neither
    #    reproduces when running Miri on macOS: they were found on CI.
    #  - the SIMD tag scan and prefetch hints are inline asm Miri cannot run.
    #    `cfg(miri)` routes to the scalar fallback, which computes the same
    #    mask, and drops the prefetches, which have no semantic effect. So the
    #    vectorised load itself is not what is checked here.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: Miri (Stacked Borrows)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cargo +nightly miri test -p cache-core --lib -- \
            --skip disk::file_pool \
            --skip disk::disk_layer \
            --skip disk::io_uring \
            --skip disk::recovery \
            --skip hugepage::

  smoketest:
    name: Smoketest (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - segment-s3fifo
          - segment-fifo
          - segment-random
          - segment-cte
          - segment-merge
          - heap-s3fifo
          - heap-lfu
          - heap-random
          - slab-lra
          - slab-lrc
          - slab-random
          - segment-s3fifo-directio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug server with validation
        run: cargo build -p server --features server/validation
      - name: Install cachecannon
        run: curl -fsSL https://cachecannon.cc/install.sh | bash
      - name: Run smoketest
        env:
          # Enable debug assertions in dependencies
          RUST_BACKTRACE: 1
        run: |
          set -euo pipefail

          CONFIG="server/config/smoketest/${{ matrix.config }}.toml"
          echo "Testing configuration: $CONFIG"
          echo "Using debug build with validation feature (checksums + assertions)"

          # Start server (debug build)
          ./target/debug/crucible-server "$CONFIG" &
          SERVER_PID=$!
          sleep 3  # Debug builds start slower

          # Verify server started
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server failed to start"
            exit 1
          fi

          # Run eviction test benchmark
          cachecannon server/config/smoketest/benchmark-eviction-test.toml || {
            echo "ERROR: Benchmark failed"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

          # Check server is still running (didn't crash)
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "ERROR: Server crashed during benchmark"
            exit 1
          fi

          # Clean shutdown
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "PASS: ${{ matrix.config }}"
