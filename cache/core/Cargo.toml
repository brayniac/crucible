[package]
name = "cache-core"
version = "0.4.2-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Redesigned cache-core with layer-based architecture"

[features]
default = []
# Let a caller drive expiry from its own clock instead of the system one.
# Gated because the check sits on the read path: with it off, the clock
# helper compiles to the same system call the code made before it existed.
# Trace replay needs it -- a replay consumes hours of recorded time in
# seconds, so wall-clock expiry never fires.
virtual-clock = []
# Tally what a merge pass keeps, by item size and frequency band. Gated
# because the record sits inside the merge loop; with it off the call
# compiles away. Measurement only -- it answers whether two engines decide
# retention differently or are shown different items, which no outcome
# metric can separate.
retention-trace = []
loom = ["dep:loom"]
# Randomized concurrency testing under sequential consistency. Deliberately
# complementary to `loom`, not a replacement:
#
#   loom models weak memory but over-approximates SeqCst -- it reports the
#   store-buffering outcome even for a pure-SeqCst litmus (see
#   `shuttle_tests::shuttle_seqcst_store_buffering_forbidden`, which loom
#   fails), so the loom models can only assert SC-independent properties.
#
#   shuttle executes sequentially consistently, treating every ordering as
#   SeqCst. That makes the SC-total-order halves of the protocol invariants
#   assertable -- a pinned reader never coexists with a committed drain, a
#   condemned segment is freed exactly once -- which is this module's entire
#   purpose. The trade is symmetric: shuttle can NEVER catch an ordering that
#   is too weak (a Release degraded to Relaxed), which is what loom covers.
#
# Keep both suites green; neither subsumes the other. `loom` wins when both
# features are on, so the shuttle module is gated `not(feature = "loom")`.
#
#   cargo test -p cache-core --features shuttle -- shuttle_
#
# The name filter matters: like loom's, these models panic outside their runner.
shuttle = ["dep:shuttle"]
# Adds magic bytes and checksums to item headers for corruption detection.
# Useful for debugging but adds overhead to every read operation.
validation = []

[dependencies]
ahash = { workspace = true }
bytes = { workspace = true }
clocksource = { workspace = true }
crossbeam-deque = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }

# Optional loom support for concurrency testing
loom = { workspace = true, features = ["checkpoint"], optional = true }

# Optional shuttle support for randomized SC concurrency testing
shuttle = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "hashtable"
harness = false

# `--cfg kani` is set by the Kani driver when verifying the #[kani::proof]
# harnesses; declare it so normal builds don't flag the cfg as unexpected.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(kani)"]
